<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Ладога Парк | Админ Панель</title>
  <style>
    body { background: #0b110e; color: #f3f4f6; font-family: var(--font-sans); }
    .admin-container { max-width: 1000px; margin: 0 auto; padding: 2rem; }
    .glass-card { background: rgba(20,34,28,0.8); border: 1px solid rgba(232,165,88,0.2); border-radius: 1rem; padding: 1.5rem; }
    
    /* Login Form */
    #loginScreen { display: flex; align-items: center; justify-content: center; height: 100vh; }
    
    /* Dashboard */
    #dashboardScreen { display: none; }
    .table-container { width: 100%; overflow-x: auto; margin-top: 1rem; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 1rem; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.1); }
    th { color: var(--accent-gold); font-weight: 700; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 0.05em; }
    td { font-size: 0.875rem; }
    .item-image { width: 48px; height: 48px; border-radius: 8px; object-fit: cover; }
    
    .btn { padding: 0.5rem 1rem; border-radius: 0.5rem; font-weight: 600; cursor: pointer; border: none; }
    .btn-primary { background: linear-gradient(135deg, var(--primary-ember), var(--accent-gold)); color: #0b110e; }
    .btn-danger { background: rgba(239,68,68,0.2); color: #ef4444; border: 1px solid rgba(239,68,68,0.4); }
    .btn-edit { background: rgba(96,165,250,0.2); color: #60a5fa; border: 1px solid rgba(96,165,250,0.4); margin-right: 0.5rem; }
    
    input, textarea, select { width: 100%; padding: 0.75rem; background: #1a2820; border: 1px solid rgba(232,165,88,0.3); border-radius: 0.5rem; color: white; outline: none; margin-bottom: 1rem; }
    
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); align-items: center; justify-content: center; z-index: 100; }
    .modal.active { display: flex; }
    .modal-content { max-width: 500px; width: 100%; }
  </style>
  <script type="module" crossorigin src="/assets/admin-BiqE7Krh.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/style-Cxe1u-3n.js">
  <link rel="stylesheet" crossorigin href="/assets/style-Br_NTKZo.css">
</head>
<body>

  <!-- Login Screen -->
  <div id="loginScreen">
    <div class="glass-card" style="width: 100%; max-width: 400px;">
      <h2 style="color: var(--accent-gold); text-align: center; margin-bottom: 1.5rem; font-family: var(--font-serif);">Вход в Панель</h2>
      <input type="text" id="username" placeholder="Логин" />
      <input type="password" id="password" placeholder="Пароль" />
      <button class="btn btn-primary" style="width: 100%;" id="loginBtn">Войти</button>
      <div id="loginError" style="color: #ef4444; margin-top: 1rem; text-align: center; font-size: 0.875rem;"></div>
      </div>
  </div>

  <!-- BOOKINGS DASHBOARD VIEW -->
  <div id="viewBookings" style="display: none;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
      <h2 style="color: white;">СМС Дашборд</h2>
      <button class="btn btn-edit" id="forceSyncBtn">🔄 Синхронизировать (TL)</button>
    </div>
    
    <div style="display: grid; grid-template-columns: 1fr; gap: 2rem;">
      <!-- Arrivals Tomorrow -->
      <div class="glass-card">
        <h3 style="color: #34d399; margin-bottom: 1rem;">Заезжают завтра</h3>
        <div class="table-container" style="margin-top: 0;">
          <table>
            <thead><tr><th>Гость</th><th>Домик</th><th>Даты</th><th>СМС (До заезда)</th></tr></thead>
            <tbody id="tomorrowArrivalsBody"></tbody>
          </table>
        </div>
      </div>

      <!-- Current Stays -->
      <div class="glass-card">
        <h3 style="color: var(--accent-gold); margin-bottom: 1rem;">Проживают сейчас</h3>
        <div class="table-container" style="margin-top: 0;">
          <table>
            <thead><tr><th>Гость</th><th>Домик</th><th>Даты</th><th>СМС (Инструкция)</th></tr></thead>
            <tbody id="currentStaysBody"></tbody>
          </table>
        </div>
      </div>

      <!-- Departures Today -->
      <div class="glass-card">
        <h3 style="color: #60a5fa; margin-bottom: 1rem;">Выезды сегодня</h3>
        <div class="table-container" style="margin-top: 0;">
          <table>
            <thead><tr><th>Гость</th><th>Домик</th><th>СМС (Продление)</th><th>СМС (Отзыв)</th></tr></thead>
            <tbody id="todayDeparturesBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
  </div>

  <!-- Dashboard -->
  <div id="dashboardScreen" class="admin-container">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
      <h1 style="color: var(--accent-gold); font-family: var(--font-serif);">Админ-панель</h1>
      <div>
        <button class="btn" id="logoutBtn" style="background: rgba(255,255,255,0.1); color: white;">Выйти</button>
      </div>
    </div>
    
    <!-- TABS -->
    <div style="display: flex; gap: 1rem; margin-bottom: 2rem; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 1rem;">
      <button class="btn btn-primary" id="tabCatalogBtn">Каталог Услуг</button>
      <button class="btn" id="tabBookingsBtn" style="background: rgba(255,255,255,0.1); color: white;">СМС и Брони</button>
    </div>

    <!-- CATALOG VIEW -->
    <div id="viewCatalog">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
        <h2 style="color: white;">Услуги</h2>
        <button class="btn btn-primary" id="openAddModalBtn">+ Добавить услугу</button>
      </div>
      <div class="glass-card table-container">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Изображение / Иконка</th>
            <th>Название</th>
            <th>Категория</th>
            <th>Цена</th>
            <th>Быстрый заказ</th>
            <th>Действия</th>
          </tr>
        </thead>
        <tbody id="catalogTableBody">
          <!-- Rows injected via JS -->
        </tbody>
      </table>
    </div>
  </div>

  <!-- Edit/Add Modal -->
  <div id="itemModal" class="modal">
    <div class="glass-card modal-content">
      <h2 id="modalTitle" style="color: var(--accent-gold); margin-bottom: 1.5rem;">Добавить услугу</h2>
      <form id="itemForm">
        <input type="hidden" id="originalId" />
        
        <label>ID (уникально, латиницей):</label>
        <input type="text" id="itemId" required />
        
        <label>Название:</label>
        <input type="text" id="itemName" required />
        
        <label>Описание:</label>
        <textarea id="itemDesc" rows="2"></textarea>
        
        <label>Цена (₽):</label>
        <input type="number" id="itemPrice" required />
        
        <label>Категория:</label>
        <select id="itemCategory">
          <option value="service">Услуги (Дрова, Прокат)</option>
          <option value="sauna">Бани</option>
        </select>
        
        <label>Эмодзи (если нет картинки):</label>
        <input type="text" id="itemIcon" placeholder="Например: 🪵" />

        <label>Картинка (заменит эмодзи):</label>
        <input type="file" id="itemImage" accept="image/*" />
        <input type="hidden" id="existingImage" />
        <img id="currentImagePreview" src="" style="width: 100px; height: 100px; object-fit: cover; border-radius: 8px; display: none; margin-bottom: 1rem;" />
        
        <label style="display: flex; align-items: center; gap: 0.5rem; margin-bottom: 1.5rem; cursor: pointer;">
          <input type="checkbox" id="itemQuickOrder" style="width: auto; margin: 0;" />
          Отображать в блоке "Уютные заказы"
        </label>
        
        <div style="display: flex; gap: 1rem;">
          <button type="submit" class="btn btn-primary" style="flex: 1;">Сохранить</button>
          <button type="button" class="btn" style="flex: 1; background: rgba(255,255,255,0.1); color: white;" id="closeModalBtn">Отмена</button>
        </div>
      </form>
    </div>
  </div>

</body>
</html>
